#:schema https://json.schemastore.org/wrangler.json
name = "inspo-mcp"
main = "src/worker.ts"
compatibility_date = "2026-04-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Retain Worker logs (console.error in the top-level catch + per-request)
# so 500s on the open, unauthenticated endpoint are visible instead of
# vanishing. View with `wrangler tail` or the Cloudflare dashboard.
[observability]
enabled = true

# Vars are set per-environment. For local dev:
#   wrangler dev --var DATABASE_URL=$DATABASE_URL --var INSPO_BASE_URL=http://localhost:3000
#
# For production:
#   wrangler secret put DATABASE_URL
#   wrangler secret put INSPO_BASE_URL

# Per-caller rate limit for the /mcp route (free Workers binding) so the
# open, unauthenticated endpoint stays abuse-resistant. period is 10 or 60.
[[ratelimits]]
name = "MCP_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

# Per-tool usage metrics (name, profile, ok/err, duration). Zero PII:
# no IPs, no query text. Query via the Analytics Engine SQL API:
#   SELECT blob1 AS tool, count() AS calls, avg(double1) AS avg_ms
#   FROM inspo_mcp_tools GROUP BY tool ORDER BY calls DESC
#
# DISABLED until Analytics Engine is enabled on the account (one click:
# https://dash.cloudflare.com/2d054aa587099f897cdff0c46ba9d97f/workers/analytics-engine
# ). Then uncomment and `wrangler deploy` - worker.ts already writes the
# datapoints whenever the binding exists.
# [[analytics_engine_datasets]]
# binding = "MCP_ANALYTICS"
# dataset = "inspo_mcp_tools"

[vars]
ENFORCE_AUTH = "0"
# Canonical web origin for links in tool responses (siteUrl, DESIGN.md).
INSPO_BASE_URL = "https://inspo-three.vercel.app"
# Where the Worker fetches the curated catalogue (seed + embeddings) at
# runtime - it isn't bundled. Defaults to the published Vercel Blob store
# if unset; re-publish with publish-catalogue-to-blob.ts after seed edits.
INSPO_CATALOGUE_URL = "https://0nme3pk5am3urwa9.public.blob.vercel-storage.com/catalogue"

# Custom domain example (uncomment + set zone in dashboard before deploy):
# [[routes]]
# pattern = "api.inspo.example.com/*"
# zone_name = "inspo.example.com"
